<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join Bedroom — Planner 5D</title>
  <style>
    :root {
      color-scheme: light;
      --text: #1d1d1f;
      --muted: #6d6d72;
      --quiet: #96969b;
      --line: #dedee1;
      --green: #0aa33c;
      --blue: #087de1;
      --button: #171718;
      --focus: #1489ee;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-width: 320px;
      background: #fff;
      color: var(--text);
      font-family: "Open Sans", "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      padding: 15px 22px 32px;
    }

    .brand {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 104px;
      height: 32px;
    }

    .brand-wordmark {
      display: block;
      width: 104px;
      height: auto;
    }

    .brand-mark {
      position: absolute;
      top: 0;
      right: 0;
      display: block;
      width: 32px;
      height: 32px;
    }

    .join-layout {
      position: relative;
      left: -22px;
      width: min(100%, 863px);
      margin: 136px auto 0;
      display: grid;
      grid-template-columns: minmax(0, 416px) 259px;
      justify-content: center;
      align-items: center;
      gap: 188px;
    }

    .join-copy {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.8px;
    }

    .invitation {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
      letter-spacing: -.15px;
    }

    .invitation strong {
      color: var(--text);
      font-weight: 600;
    }

    .invite-line {
      display: inline-block;
      white-space: nowrap;
    }

    .invite-line.is-wrapped {
      display: block;
      white-space: normal;
    }

    .invite-copy {
      display: inline;
    }

    .login-copy {
      display: block;
    }

    .invite-line.is-wrapped .invite-copy {
      display: block;
    }

    .invite-line.is-wrapped .project-title {
      display: inline;
      overflow-wrap: anywhere;
    }

    .invite-line.is-wrapped .login-copy {
      display: inline;
      margin-left: .25em;
    }

    .auth-actions {
      display: grid;
      gap: 16px;
      margin-top: 41px;
    }

    .auth-button {
      position: relative;
      width: 100%;
      min-height: 56px;
      padding: 0 48px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #393939;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .auth-button:hover {
      border-color: #b8b8bd;
    }

    .auth-button:focus-visible,
    .marketing input:focus-visible + .checkbox-ui,
    .legal a:focus-visible {
      outline: 3px solid rgb(20 137 238 / 28%);
      outline-offset: 3px;
    }

    .auth-button.primary {
      border-color: var(--button);
      background: var(--button);
      color: #fff;
    }

    .auth-button.primary:hover {
      border-color: #2e2e31;
      background: #2e2e31;
    }

    .auth-button img {
      position: absolute;
      left: 20px;
      top: 50%;
      width: 24px;
      height: 24px;
      transform: translateY(-50%);
    }

    .legal {
      max-width: 416px;
      margin: 42px auto 0;
      color: var(--quiet);
      font-size: 14px;
      line-height: 1.4;
    }

    .legal a {
      color: var(--muted);
      text-decoration: none;
    }

    .legal a:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .marketing {
      position: relative;
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 16px;
      align-items: start;
      margin: 25px 0 0 2px;
      color: var(--quiet);
      font-size: 14px;
      line-height: 1.4;
      text-align: left;
      cursor: pointer;
    }

    .marketing input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .checkbox-ui {
      position: relative;
      display: block;
      width: 20px;
      height: 20px;
      margin-top: 1px;
      border: 2px solid #9c9ca1;
      border-radius: 6px;
      background: #fff;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .marketing input:checked + .checkbox-ui {
      border-color: var(--green);
      background: var(--green);
    }

    .project-preview {
      position: relative;
      width: 259px;
      height: 175px;
      justify-self: center;
    }

    .project-card {
      position: absolute;
      left: 43px;
      top: 1px;
      width: 188px;
      height: 188px;
      overflow: hidden;
      border-radius: 24px;
      background: #edf3fb;
    }

    .project-card::after {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgb(0 0 0 / 6%);
      content: "";
      pointer-events: none;
    }

    .project-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .collaborator-group {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      gap: 3px;
      animation: collaborator-triangle 4.5s ease-in-out infinite;
      will-change: transform;
    }

    .collaborator-group.you {
      left: 0;
      top: 43px;
    }

    .collaborator-group.owner {
      right: 0;
      top: 107px;
      animation-delay: -1.5s;
    }

    .collaborator {
      flex: none;
      min-width: 54px;
      padding: 12px 16px;
      border-radius: 999px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      box-shadow: 0 3px 10px rgb(0 0 0 / 8%);
    }

    .collaborator-group.you .collaborator {
      margin-top: 18px;
      background: var(--blue);
    }

    .collaborator-group.owner .collaborator {
      margin-top: 22px;
      background: var(--green);
    }

    .collaborator-cursor {
      display: block;
      flex: none;
      width: 32px;
      height: 32px;
      pointer-events: none;
    }

    .collaborator-group.owner .collaborator-cursor {
      transform: scaleX(-1);
    }

    @keyframes collaborator-triangle {
      0%,
      22.222% {
        transform: translateY(0);
      }

      33.333%,
      55.555% {
        transform: translate(10px, -8px);
      }

      66.666%,
      88.888% {
        transform: translate(12px, 7px);
      }

      100% {
        transform: translateY(0);
      }
    }

    .status {
      min-height: 20px;
      margin: 18px 0 -38px;
      color: var(--green);
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .status.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 980px) {
      .join-layout {
        left: 0;
        margin-top: 56px;
        grid-template-columns: minmax(0, 416px);
        gap: 36px;
      }

      .project-preview {
        grid-row: 1;
      }

    }

    @media (max-width: 620px) {
      .page {
        padding: 20px 20px 36px;
      }

      .brand {
        width: 104px;
        height: 32px;
      }

      .brand-wordmark {
        width: 104px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
      }

      .join-layout {
        margin-top: 40px;
        gap: 30px;
      }

      .project-preview {
        width: 224px;
        height: 161px;
      }

      .project-card {
        left: 32px;
        width: 160px;
        height: 160px;
        border-radius: 18px;
      }

      .collaborator {
        min-width: 60px;
        padding: 8px 14px 9px;
        font-size: 16px;
      }

      .collaborator-group.you {
        top: 38px;
      }

      .collaborator-group.owner {
        top: 96px;
      }

      .collaborator-cursor {
        width: 22px;
        height: 22px;
      }

      .collaborator-group.you .collaborator {
        margin-top: 18px;
      }

      .collaborator-group.owner .collaborator {
        margin-top: 22px;
      }

      h1 {
        font-size: 32px;
      }

      .invitation {
        margin-top: 14px;
        font-size: 18px;
        line-height: 1.5;
      }

      .invite-line {
        display: inline;
        white-space: normal;
      }

      .auth-actions {
        margin-top: 32px;
        gap: 14px;
      }

      .auth-button {
        min-height: 56px;
        padding: 0 48px;
        font-size: 17px;
      }

      .auth-button img {
        left: 20px;
        width: 24px;
        height: 24px;
      }

      .legal {
        margin-top: 32px;
        font-size: 14px;
      }

      .marketing {
        grid-template-columns: 24px 1fr;
        gap: 12px;
        margin-top: 25px;
        font-size: 14px;
      }

      .checkbox-ui {
        width: 20px;
        height: 20px;
        border-width: 2px;
        border-radius: 7px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .collaborator-group {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="brand" href="#" aria-label="Planner 5D home">
      <img class="brand-wordmark" src="./spaces-static/assets/images/footer/footer-logo.svg" alt="Planner 5D">
      <img class="brand-mark" src="./spaces-static/assets/images/header/logo-sm.svg" alt="">
    </a>

    <section class="join-layout" aria-labelledby="join-title">
      <div class="join-copy">
        <h1 id="join-title">Join Project</h1>
        <p class="invitation">
          <span class="invite-line">
            <span class="invite-copy"><strong data-owner-name>Vanessa</strong> invited you to join the project</span>
            <span class="project-title"><strong>“<span data-project-name>Bedroom</span>”</strong>.</span>
            <span class="login-copy">Log in or sign up to join.</span>
          </span>
        </p>

        <div class="auth-actions" aria-label="Authentication methods">
          <button class="auth-button primary" type="button" data-provider="Google">
            <img src="./spaces-static/assets/images/modal/google-icon.svg" alt="">
            Continue with Google
          </button>
          <button class="auth-button" type="button" data-provider="Apple">
            <img src="./spaces-static/assets/images/modal/apple-icon.svg" alt="">
            Continue with Apple
          </button>
          <button class="auth-button" type="button" data-provider="email">
            <img src="./spaces-static/assets/images/modal/email-icon.svg" alt="">
            Continue with email
          </button>
        </div>

        <p class="status" role="status" aria-live="polite"></p>

        <p class="legal">
          By continuing you agree to our <a href="#">Terms of Service</a>,
          <a href="#">Privacy Policy</a> and <a href="#">Cookies Policy</a>.
        </p>

        <label class="marketing">
          <input type="checkbox">
          <span class="checkbox-ui" aria-hidden="true"></span>
          <span>I agree to receive newsletters and other marketing communication, including discounts.</span>
        </label>
      </div>

      <aside class="project-preview" aria-label="Shared project preview">
        <div class="project-card">
          <img
            data-project-cover
            src="https://storage.planner5d.com/thumbs.600/c43e4a67658b1f65e9c1b043efa21e3b.webp"
            alt="Top-down preview of Bedroom"
            referrerpolicy="no-referrer"
          >
        </div>
        <div class="collaborator-group you">
          <span class="collaborator">You</span>
          <img
            class="collaborator-cursor"
            src="./spaces-static/assets/images/collaboration/cursor.svg"
            alt=""
          >
        </div>
        <div class="collaborator-group owner">
          <img
            class="collaborator-cursor"
            src="./spaces-static/assets/images/collaboration/cursor-green.svg"
            alt=""
          >
          <span class="collaborator" data-owner-name>Vanessa</span>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const status = document.querySelector(".status");
    const authButtons = document.querySelectorAll("[data-provider]");
    const invitation = document.querySelector(".invitation");
    const inviteLine = document.querySelector(".invite-line");
    let statusTimer;
    let invitationFrame;

    const projectSources = [
      {
        owner: "Vanessa",
        csv: "./vanessas_data/floorplans.csv"
      },
      {
        owner: "Evelina",
        csv: "./evelinas_data/products.csv"
      }
    ];
    const fallbackProjects = {
      Vanessa: [
        {
          owner: "Vanessa",
          name: "Tyquilla's Project V25",
          hash: "93bffadeb477f7870c98c052df3c5e8e"
        },
        {
          owner: "Vanessa",
          name: "Quintadopadel V2",
          hash: "b326fa625066414a3de7ed47cc2e5858"
        },
        {
          owner: "Vanessa",
          name: "Darren, Main Bedroom",
          hash: "c37b6ac5eeaf3fb9830244b8a3d6721f"
        },
        {
          owner: "Vanessa",
          name: "K's House",
          hash: "e1a4e662ce435641eb7cdc02ed462d53"
        },
        {
          owner: "Vanessa",
          name: "311 Chestnut - All floors",
          hash: "e2faf549a2cb7a0609ee703b2f69b0bd"
        }
      ],
      Evelina: [
        {
          owner: "Evelina",
          name: "Cozy reading nook",
          hash: "88a41f30d314fc1b797780e4a9c73c73"
        },
        {
          owner: "Evelina",
          name: "Studio Silhouette copy copy",
          hash: "88762faf99fd6e50944db306f32151c1"
        },
        {
          owner: "Evelina",
          name: "Retro",
          hash: "df5c17777d55216646adc874e770dd7b"
        },
        {
          owner: "Evelina",
          name: "Midnight Mood Room copy",
          hash: "058d7fa088b12578dbe888680bf8dd24"
        },
        {
          owner: "Evelina",
          name: "Ellie's Dinner Place",
          hash: "bd26c368ffbdd24176b5e5ebd1ab4a3e"
        }
      ]
    };

    const parseCsv = (source) => {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;

      for (let index = 0; index < source.length; index += 1) {
        const character = source[index];
        const nextCharacter = source[index + 1];

        if (character === '"' && quoted && nextCharacter === '"') {
          value += '"';
          index += 1;
        } else if (character === '"') {
          quoted = !quoted;
        } else if (character === "," && !quoted) {
          row.push(value);
          value = "";
        } else if ((character === "\n" || character === "\r") && !quoted) {
          if (character === "\r" && nextCharacter === "\n") index += 1;
          row.push(value);
          if (row.some((cell) => cell.length)) rows.push(row);
          row = [];
          value = "";
        } else {
          value += character;
        }
      }

      row.push(value);
      if (row.some((cell) => cell.length)) rows.push(row);

      const [headers = [], ...data] = rows;
      return data.map((cells) => Object.fromEntries(
        headers.map((header, index) => [header, cells[index] || ""])
      ));
    };

    const randomIndex = (length) => {
      if (window.crypto?.getRandomValues) {
        const randomValue = new Uint32Array(1);
        window.crypto.getRandomValues(randomValue);
        return randomValue[0] % length;
      }

      return Math.floor(Math.random() * length);
    };

    const previousProject = () => {
      try {
        return JSON.parse(sessionStorage.getItem("shared-project-last") || "null");
      } catch {
        return null;
      }
    };

    const rememberProject = (project) => {
      try {
        sessionStorage.setItem("shared-project-last", JSON.stringify(project));
      } catch {
        // The page still works when session storage is unavailable.
      }
    };

    const updateInvitationWrapping = () => {
      window.cancelAnimationFrame(invitationFrame);
      inviteLine.classList.remove("is-wrapped");

      invitationFrame = window.requestAnimationFrame(() => {
        inviteLine.classList.toggle(
          "is-wrapped",
          inviteLine.scrollWidth > invitation.clientWidth
        );
      });
    };

    const applyProject = (project) => {
      document.querySelectorAll("[data-owner-name]").forEach((element) => {
        element.textContent = project.owner;
      });
      document.querySelector("[data-project-name]").textContent = project.name;

      const cover = document.querySelector("[data-project-cover]");
      cover.src = `https://storage.planner5d.com/thumbs.600/${encodeURIComponent(project.hash)}.webp`;
      cover.alt = `Top-down preview of ${project.name}`;
      document.title = `Join ${project.name} — Planner 5D`;
      rememberProject(project);
      updateInvitationWrapping();
    };

    const loadRandomProject = async () => {
      const source = projectSources[randomIndex(projectSources.length)];
      const lastProject = previousProject();

      try {
        const response = await fetch(source.csv);
        if (!response.ok) throw new Error(`Unable to load ${source.csv}`);

        const projects = parseCsv(await response.text())
          .filter((project) => (
            project.deleted !== "1"
            && project.hash
            && project.name
            && project.hash !== lastProject?.hash
            && project.name.trim() !== lastProject?.name
          ))
          .map((project) => ({
            owner: source.owner,
            name: project.name.trim(),
            hash: project.hash.trim()
          }));

        if (!projects.length) throw new Error(`No usable projects in ${source.csv}`);
        applyProject(projects[randomIndex(projects.length)]);
      } catch {
        const availableFallbacks = fallbackProjects[source.owner].filter((project) => (
          project.hash !== lastProject?.hash
          && project.name !== lastProject?.name
        ));
        applyProject(availableFallbacks[randomIndex(availableFallbacks.length)]);
      }
    };

    authButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const provider = button.dataset.provider;
        window.clearTimeout(statusTimer);
        status.textContent = `Demo: continue with ${provider}`;
        status.classList.add("visible");
        statusTimer = window.setTimeout(() => status.classList.remove("visible"), 2600);
      });
    });

    window.addEventListener("resize", updateInvitationWrapping);
    loadRandomProject();
  </script>
</body>
</html>
